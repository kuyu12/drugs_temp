[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moh-medical-devices-pipeline"
version = "0.2.0"
description = "Medical Devices API to pandas, including Databricks notebook"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.3,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
